[package]
name = "vxr-preview-spike"
version = "0.0.0"
edition = "2024"
publish = false
description = "Phase 2 test 2: live progressive path-traced preview on the test 1 brick map (throwaway spike)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vxr-engine-spike = { path = "../engine" }
wgpu = "30.0.1"
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
futures-channel = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1"
png = "0.18"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["webgpu", "wgsl", "std"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Performance", "Document", "HtmlCanvasElement", "Element", "console", "Request", "RequestInit", "Response", "Headers", "Location"] }
console_error_panic_hook = "0.1"

[profile.release]
debug = 0
