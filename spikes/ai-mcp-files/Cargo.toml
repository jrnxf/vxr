[package]
name = "vxr-mcp-files"
version = "0.0.0"
edition = "2024"
publish = false
description = "Phase AI spike (test 5): a throwaway `vxr mcp` files mode over vxr-core and the .vox codec"

# Its own workspace, apart from the root one.
[workspace]

[[bin]]
name = "vxr-mcp"
path = "src/main.rs"

[dependencies]
vxr-core = { path = "../../crates/vxr-core" }
vxr-vox = { path = "../../crates/vxr-vox" }
serde_json = "1"

[profile.release]
debug = 0

[profile.dev]
debug = 0
