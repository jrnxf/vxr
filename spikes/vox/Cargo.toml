[package]
name = "vxr-vox"
version = "0.0.0"
edition = "2024"
publish = false
description = "Phase 2 spike: lossless two-layer .vox codec (raw chunks + semantics)"

[lib]
name = "vox"

[dependencies]
# Pure-Rust zlib, only for Teardown's TDCZ chunks.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
dot_vox = "5"
proptest = { version = "1", default-features = false, features = ["std"] }

[profile.release]
debug = 0

[profile.dev]
debug = 0
