[package]
name = "vxr-engine-spike"
version = "0.0.0"
edition = "2024"
publish = false
description = "Phase 2 test 1: sparse brick map ray marched in WGSL compute (throwaway spike)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpu = "30.0.1"
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
futures-channel = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1"
png = "0.18"
winit = "0.30"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["webgpu", "wgsl", "std"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Performance", "Document", "HtmlCanvasElement", "console"] }
console_error_panic_hook = "0.1"

[features]
# The test 1 browser bench entry points (src/web.rs). Off for crates that only want the library.
default = ["bench-web"]
bench-web = []

[profile.release]
debug = 0
