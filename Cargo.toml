[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
vxr-vox = { path = "crates/vxr-vox" }
vxr-core = { path = "crates/vxr-core" }
vxr-render = { path = "crates/vxr-render" }
vxr-ops = { path = "crates/vxr-ops" }
vxr-mcp = { path = "crates/vxr-mcp" }
vxr-ai = { path = "crates/vxr-ai" }
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }

[profile.release]
debug = 0

[profile.dev]
debug = 0

# The browser build: small and fast to load. opt-level z everywhere except where measured:
# vxr-core and vxr-vox stay at s (z makes opening and saving a scene 30-50% slower), and the
# SIMD fallback crates build at 3, which inlines their generic code away and is smaller than z
# or s (the wasm is ~100 KB brotli smaller). Change one at a time and rebuild with
# crates/vxr-web/build, which prints the compressed sizes.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.wasm.package.vxr-core]
opt-level = "s"

[profile.wasm.package.vxr-vox]
opt-level = "s"

[profile.wasm.package.fearless_simd]
opt-level = 3

[profile.wasm.package.vello_cpu]
opt-level = 3

[profile.wasm.package.vello_common]
opt-level = 3
