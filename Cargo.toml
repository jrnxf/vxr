[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
vxr-vox = { path = "crates/vxr-vox" }
vxr-core = { path = "crates/vxr-core" }
vxr-render = { path = "crates/vxr-render" }
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }

[profile.release]
debug = 0

[profile.dev]
debug = 0
