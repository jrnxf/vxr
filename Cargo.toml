[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
vxr-vox = { path = "crates/vxr-vox" }
vxr-core = { path = "crates/vxr-core" }
vxr-render = { path = "crates/vxr-render" }
vxr-ops = { path = "crates/vxr-ops" }
vxr-ai = { path = "crates/vxr-ai" }
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }

[profile.release]
debug = 0

[profile.dev]
debug = 0

# The browser build: small and fast to load (same settings as the Phase 2 embed).
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
