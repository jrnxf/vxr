name: CI

# What every pull request and every commit on main must pass before it merges, deploys or is
# released: the repo's local gate (fmt, clippy, the wasm build, cargo test) with the GPU tests
# running for real on Mesa's software Vulkan (lavapipe), and the headless `--shot` run of the
# editor's UI. release.yml calls this workflow for a tag, so a release builds only a tested commit.
# The UI run takes about half an hour, so on a pull request it runs only when the change can affect
# it (see the scope step of `shot`); a push to main and a call from release.yml always run it.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

# A newer push to a pull request replaces its run. In a called workflow github.workflow is the
# caller's name and the caller holds its own group, so the ci- prefix keeps the two apart (group
# names are case-insensitive) and a call never cancels another.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.workflow == 'CI' }}

permissions:
  contents: read

# An explicit bash adds -o pipefail, so a failing command piped into tee fails its step.
defaults:
  run:
    shell: bash

env:
  # As release.yml and crates/vxr-web/cloudflare-build pin it (rust-overlay's stable in nix/flake.lock).
  RUST: 1.99.1
  CARGO_TERM_COLOR: always
  # Lavapipe is the only adapter; without one a GPU test fails instead of passing by skipping.
  VXR_REQUIRE_GPU: "1"

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install "$RUST" --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup default "$RUST"

      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ env.RUST }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ env.RUST }}-

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --target wasm32-unknown-unknown

      - name: Install a software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers

      # The island is the scene the island tests and the --shot run load; without it they skip.
      - name: Build the island scene
        run: node prototype/src/build.mjs

      - run: cargo test --workspace

  # The editor's UI checks (every tool, flyout, Cmd-K command and world mode through the same
  # pointer path as the window), headless, on lavapipe. Each path-traced frame is a set number of
  # samples, so a slow software GPU takes longer and cannot fail a step on timing.
  # On a pull request the steps after `scope` run only when the PR changes a file the run builds or
  # loads; otherwise the job still reports a pass, quickly, so it can stay a required check.
  shot:
    name: UI checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VXR_SHOT_SAMPLES: "1"
    steps:
      # The pull request's checkout is its merge into the base, so HEAD^1 is the base and two
      # commits of history are enough to list what the PR changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      # The paths the run depends on: the app and the crates it links (vxr-web is not one of them),
      # the workspace manifests, the island scene's inputs (prototype/), the font fetch and this file.
      - name: Decide whether the UI checks apply
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          run=true
          if [ "$EVENT" = pull_request ]; then
            files="$(git diff --name-only HEAD^1 HEAD)"
            if ! grep -E '^(crates/vxr-(app|core|render|vox|ops|mcp|ai)/|Cargo\.(toml|lock)$|prototype/|\.github/workflows/ci\.yml$)' <<<"$files"; then
              run=false
              echo "No file the UI checks depend on changed; skipping them."
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Install the Rust toolchain
        if: steps.scope.outputs.run == 'true'
        run: |
          rustup toolchain install "$RUST" --profile minimal
          rustup default "$RUST"

      - if: steps.scope.outputs.run == 'true'
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-shot-${{ runner.os }}-${{ env.RUST }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-shot-${{ runner.os }}-${{ env.RUST }}-

      - name: Install a software Vulkan driver
        if: steps.scope.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers

      - if: steps.scope.outputs.run == 'true'
        run: node prototype/src/build.mjs
      - if: steps.scope.outputs.run == 'true'
        run: crates/vxr-app/fetch-fonts

      - name: Run the UI checks
        if: steps.scope.outputs.run == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          cargo run --release -p vxr-app -- --shot "$RUNNER_TEMP/shots" prototype/demo/scene.vox | tee "$RUNNER_TEMP/shot.log"
          echo "$(grep -c '^ok' "$RUNNER_TEMP/shot.log") steps ok"

  # The Worker behind /api/* and /account, the account page and the landing page (site/): types, oxlint, oxfmt, and the tests in workerd
  # with local D1 and R2 (no test calls Turnstile or Resend). NODE matches the NODE_VERSION build
  # variable of Workers Builds.
  worker:
    name: Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crates/vxr-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: crates/vxr-web/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
