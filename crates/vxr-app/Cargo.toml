[package]
name = "vxr-app"
description = "vxr's desktop editor: the Hybrid UI in egui over the brick map renderer"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "vxr"
path = "src/main.rs"

[dependencies]
vxr-core.workspace = true
vxr-vox.workspace = true
vxr-render.workspace = true
vxr-ops.workspace = true
vxr-ai.workspace = true
serde_json = "1"
glam.workspace = true
egui = "0.37"
egui-wgpu = { version = "0.37", default-features = false }
png = "0.18"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = "30.0.1"
winit = "0.30"
egui-winit = { version = "0.37", default-features = false, features = ["clipboard", "links", "wayland", "x11"] }
pollster = "1"
rfd = "0.15"
# The assistant: HTTPS without gzip (streams must not be buffered), and the OS keychain.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
keyring = "4.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["webgpu", "wgsl", "std"] }
