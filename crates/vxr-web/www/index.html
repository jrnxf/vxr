<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vxr</title>
<meta name="description" content="fast voxel scenes">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!--
  The vxr editor in the browser. Everything on the canvas (scene and UI) is the Rust editor
  (pkg/, built by crates/vxr-web/build); app.js forwards input, opens files and downloads saves.
-->
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<input id="ime" autocomplete="off" aria-hidden="true">
<input id="file" type="file" accept=".vox" hidden>
<div id="msg"><p>Loading vxr…</p></div>
<script type="module" src="app.js"></script>
</body>
</html>
