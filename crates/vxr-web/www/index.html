<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vxr</title>
<meta name="description" content="fast voxel scenes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a5b4fc' stroke-width='2' stroke-linejoin='round'%3E%3Cpath d='M12 2 3 7v10l9 5 9-5V7z'/%3E%3Cpath d='m3 7 9 5 9-5M12 12v10'/%3E%3C/svg%3E">
<!--
  The vxr editor in the browser. Everything on the canvas (scene and UI) is the Rust editor
  (pkg/, built by crates/vxr-web/build); app.js forwards input, opens files and downloads saves.
-->
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<input id="ime" autocomplete="off" aria-hidden="true">
<input id="file" type="file" accept=".vox" hidden>
<div id="msg"><p>Loading vxr…</p></div>
<script type="module" src="app.js"></script>
</body>
</html>
