<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vxr - free voxel scene editor in your browser</title>
    <meta
      name="description"
      content="Sculpt, paint and path-trace voxel scenes on the GPU. vxr is a free, open-source editor that opens MagicaVoxel .vox files in your browser or on a Mac."
    />
    <link rel="canonical" href="https://vxr.jrnxf.co/" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="vxr" />
    <meta property="og:url" content="https://vxr.jrnxf.co/" />
    <meta
      property="og:title"
      content="vxr - free voxel scene editor in your browser"
    />
    <meta
      property="og:description"
      content="Sculpt, paint and path-trace voxel scenes on the GPU. Free and open source. Opens MagicaVoxel .vox files."
    />
    <meta property="og:image" content="https://vxr.jrnxf.co/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The vxr editor with a voxel island, beside the words Voxel scenes, fast."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
  The vxr editor in the browser. Everything on the canvas (scene and UI) is the Rust editor
  (pkg/, built by crates/vxr-web/build); app.js forwards input, opens files and downloads saves.
  The boot screen and the landing page (#root) are Preact, pre-rendered into this file at
  build time (src/entry.tsx). First visits start on the landing page while the editor loads
  behind it; later visits show the boot cube until the editor draws. gate.js picks which.
-->
    <script src="/gate.js"></script>
    <link rel="modulepreload" href="/pkg/vxr_web.js" />
    <script type="module" src="/src/entry.tsx" prerender></script>
  </head>
  <body>
    <canvas id="c" tabindex="0"></canvas>
    <input id="ime" autocomplete="off" aria-hidden="true" />
    <input id="file" type="file" accept=".vox" hidden />
    <div id="challenge"></div>
    <div id="root"></div>
    <div id="msg" hidden></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
