[package]
name = "vxr-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
vxr-core = { path = ".." }
vxr-vox = { path = "../../vxr-vox" }

[[bin]]
name = "scene_from_vox"
path = "fuzz_targets/scene_from_vox.rs"
test = false
doc = false
bench = false

# Keep the fuzz crate out of the repo workspace.
[workspace]
members = ["."]
