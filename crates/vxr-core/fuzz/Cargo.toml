[package]
name = "vxr-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
vxr-core = { path = ".." }
vxr-vox = { path = "../../vxr-vox" }

[[bin]]
name = "scene_from_vox"
path = "fuzz_targets/scene_from_vox.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bricks_decode"
path = "fuzz_targets/bricks_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "embed_open"
path = "fuzz_targets/embed_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "palette_parse"
path = "fuzz_targets/palette_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "image_decode"
path = "fuzz_targets/image_decode.rs"
test = false
doc = false
bench = false

# Keep the fuzz crate out of the repo workspace.
[workspace]
members = ["."]
