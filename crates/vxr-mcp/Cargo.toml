[package]
name = "vxr-mcp"
description = "vxr mcp: a stdio MCP server that edits .vox files under one folder through vxr-ops"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
vxr-core.workspace = true
vxr-vox.workspace = true
vxr-ops.workspace = true
serde_json = "1"

[target.'cfg(unix)'.dependencies]
# geteuid, to check the live folder is the user's own.
libc = "0.2"
