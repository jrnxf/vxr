[package]
name = "vxr-render"
description = "vxr's GPU renderer: the brick map on the GPU, ray marched with trace_h in WGSL compute"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
vxr-core.workspace = true
glam.workspace = true
bytemuck.workspace = true
futures-channel = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = "30.0.1"

# The browser build uses WebGPU only (no WebGL fallback).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["webgpu", "wgsl", "std"] }
web-sys = { version = "0.3", features = ["Window", "Performance"] }

[dev-dependencies]
pollster = "1"
