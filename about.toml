# cargo-about's settings for the Rust notices in each release (.github/workflows/release.yml).
# A dependency under a license missing here fails the release build, so a new license is a choice.
accepted = [
    # In order of preference, for a crate that offers a choice.
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    # webpki-roots, the certificate authorities the assistant's HTTPS trusts.
    "CDLA-Permissive-2.0",
]
# The release targets.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
# Only what is compiled into the binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# vxr's own crates (publish = false): this file is about everyone else's.
private = { ignore = true }
